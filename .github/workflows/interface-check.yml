name: Zyro Interface Check
on:
  pull_request:
  push:
    branches: ['design/zyro-1.1']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Test gateway and build preview
        run: bash gradlew :gateway:test :theme:testDebugUnitTest :feature_console_rpc:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Zyro-interface-preview
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-test-results
          path: gateway/build/reports/tests/
          if-no-files-found: ignore
