name: Zyro Signed Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZYRO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ZYRO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZYRO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZYRO_KEY_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, base64
          from pathlib import Path
          names = ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Configure all four ZYRO signing secrets using the ORIGINAL signing key. No replacement key will be generated.')
          Path('release.keystore').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          values = {'storeFile': 'release.keystore', 'storePassword': os.environ['STORE_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS'], 'keyPassword': os.environ['KEY_PASSWORD']}
          Path('keystore.properties').write_text(''.join(key + '=' + escape(value) + '\n' for key, value in values.items()))
          PYTHON
      - name: Test and build
        run: bash gradlew :gateway:test :app:assembleRelease --no-daemon
      - name: Verify signature
        shell: bash
        run: |
          mkdir -p release
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' -print -quit)
          test -n "$APK"
          cp "$APK" release/Zyro-1.1.0.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release/Zyro-1.1.0.apk > release/signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Zyro-signed
          path: release/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: 'v1.1.0-${{ github.run_number }}'
          name: Zyro 1.1.0
          draft: true
          body: New interface. Update compatibility requires the same signing certificate as the installed app.
          files: release/*
      - name: Remove signing material
        if: always()
        run: rm -f release.keystore keystore.properties
